services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg://jobfit:jobfit@db:5432/jobfit
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
