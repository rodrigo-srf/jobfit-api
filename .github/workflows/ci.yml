name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest-cov pip-audit

      - name: Compile application
        run: python -m compileall -q app

      - name: Lint critical Python errors
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Run tests with coverage
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret-key-change-me
          DATABASE_URL: sqlite:///./jobfit_ci.db
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  container:
    name: Container build and security
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --tag jobfit-api:${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jobfit-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Start container
        run: |
          docker run -d \
            --name jobfit-api-ci \
            -p 8000:8000 \
            -e APP_ENV=test \
            -e SECRET_KEY=ci-only-secret-key-change-me \
            -e DATABASE_URL=sqlite:///./jobfit_ci.db \
            jobfit-api:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become healthy."
          docker logs jobfit-api-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs jobfit-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f jobfit-api-ci || true
